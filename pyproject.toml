[project]
name = "support-reply"
version = "0.0.1"
description = "Groww multi-agent support reply drafts."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.161.1",
  "google-genai>=1.0",
  "groq>=0.13",
  "langgraph>=0.2",
  "mcp>=2.3.0",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_reply"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Core Pydantic V1 functionality isn't compatible:UserWarning",
]
